<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 56" width="160" height="56">
  <defs>
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="bgBoxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Contenedor exterior blanco redondeado tipo credencial -->
  <rect x="1" y="1" width="158" height="54" rx="8" fill="url(#bgBoxGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  
  <!-- Icono del Libro a la izquierda -->
  <g transform="translate(10, 10)">
    <!-- Cubierta trasera azul -->
    <path d="M2 4 C6 2, 16 2, 17 5 L17 31 C16 28, 6 28, 2 30 Z" fill="#0369a1" />
    <path d="M34 4 C30 2, 20 2, 19 5 L19 31 C20 28, 30 28, 34 30 Z" fill="#0284c7" />
    <!-- Páginas interiores blancas -->
    <path d="M4 6 C8 4, 16 4, 17 7 L17 29 C16 26, 8 26, 4 28 Z" fill="#ffffff" />
    <path d="M32 6 C28 4, 20 4, 19 7 L19 29 C20 26, 28 26, 32 28 Z" fill="#f1f5f9" />
    <!-- Líneas de texto simuladas en páginas -->
    <line x1="7" y1="11" x2="14" y2="10" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="7" y1="15" x2="14" y2="14" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="7" y1="19" x2="14" y2="18" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="22" y1="10" x2="29" y2="11" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="22" y1="14" x2="29" y2="15" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="22" y1="18" x2="29" y2="19" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
    <!-- Cinta separadora dorada/amarilla típica de INDECOPI -->
    <path d="M17 5 L19 5 L19 22 L18 20 L17 22 Z" fill="#eab308" />
  </g>
  
  <!-- Textos oficiales -->
  <text x="52" y="21" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="800" fill="#0f172a" letter-spacing="0.2">LIBRO DE</text>
  <text x="52" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="800" fill="#0284c7" letter-spacing="0.2">RECLAMACIONES</text>
  <text x="52" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="7" font-weight="600" fill="#64748b">CONFORME A INDECOPI</text>
</svg>
